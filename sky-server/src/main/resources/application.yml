server:
  port: 8080

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  elasticsearch:
    uris: http://localhost:9200
  datasource:
    druid:
      driver-class-name: ${sky.datasource.driver-class-name}
      url: jdbc:mysql://${sky.datasource.host}:${sky.datasource.port}/${sky.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${sky.datasource.username}
      password: ${sky.datasource.password}
  redis:
    host: ${sky.redis.host}
    port: ${sky.redis.port}
    password: ${sky.redis.password}
    database: ${sky.redis.database}
  rabbitmq:
    host: ${sky.rabbitmq.host}
    port: ${sky.rabbitmq.port}
    username: ${sky.rabbitmq.username}
    password: ${sky.rabbitmq.password}
    virtual-host: ${sky.rabbitmq.virtual-host}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sky.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      sky:
        mapper: info
        service: info
        controller: info
    org:
      elasticsearch:
        client:
          RestClient: error
    ShardingSphere-SQL: warn

sky:
  jwt:
    # 设置jwt签名加密时使用的秘钥
    admin-secret-key: itcast
    # 设置jwt过期时间
    admin-ttl: 7200000000000
    # 设置前端传递过来的令牌名称
    admin-token-name: token

    # 用户
    user-secret-key: itheima
    user-ttl: 720000000000000
    user-token-name: authentication

  alioss:
    endpoint: ${sky.alioss.endpoint} # 确保和你创建 Bucket 时选的地域一致
    access-key-id: ${sky.alioss.access-key-id} # 填入刚才拿到的 ID
    access-key-secret: ${sky.alioss.access-key-secret} # 填入刚才拿到的 Secret
    bucket-name: ${sky.alioss.bucket-name} # 填入你创建的 Bucket 名字

  wechat:
    appid: ${sky.wechat.appid}
    secret: ${sky.wechat.secret}

  rabbitmq:
    host: ${sky.rabbitmq.host}
    port: ${sky.rabbitmq.port}
    username: ${sky.rabbitmq.username}
    password: ${sky.rabbitmq.password}
    virtual-host: ${sky.rabbitmq.virtual-host}

  mq:
    exchange: ${sky.mq.exchange}
    queue: ${sky.mq.queue}
    logistics-queue: ${sky.mq.logistics-queue}
    coupon-queue: ${sky.mq.coupon-queue}
    coupon-dlx-exchange: ${sky.mq.coupon-dlx-exchange}
    coupon-dlq-queue: ${sky.mq.coupon-dlq-queue}
    routing-key-created: ${sky.mq.routing-key-created}
    routing-key-paid: ${sky.mq.routing-key-paid}
    routing-key-cancelled: ${sky.mq.routing-key-cancelled}
    routing-key-logistics-status: ${sky.mq.routing-key-logistics-status}
    routing-key-coupon-grab: ${sky.mq.routing-key-coupon-grab}
    routing-key-coupon-dead: ${sky.mq.routing-key-coupon-dead}
    coupon-consumer:
      concurrent-consumers: ${sky.mq.coupon-consumer.concurrent-consumers}
      max-concurrent-consumers: ${sky.mq.coupon-consumer.max-concurrent-consumers}
      prefetch-count: ${sky.mq.coupon-consumer.prefetch-count}
    outbox-dispatch:
      fixed-delay-millis: ${sky.mq.outbox-dispatch.fixed-delay-millis}
      batch-size: ${sky.mq.outbox-dispatch.batch-size}
      worker-count: ${sky.mq.outbox-dispatch.worker-count}

  rate-limit:
    redis:
      max-requests: 30
      window-millis: 60000
    local:
      cache-maximum-size: 100000
      expire-after-access-minutes: 10
      high:
        capacity: 5
        refill-tokens: 5
        refill-millis: 60000
      low:
        capacity: 60
        refill-tokens: 60
        refill-millis: 60000
    degrade:
      failure-threshold: 5
      recovery-success-threshold: 3
      duration-millis: 30000
      probe-fixed-delay-millis: 5000
